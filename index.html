/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const cityOf = (co,ci) => COUNTRIES[co].cities[ci];
const C_MEAN = 4.3, M_WEIGHT = 300;
const smart = x => (x.v/(x.v+M_WEIGHT))*x.r + (M_WEIGHT/(x.v+M_WEIGHT))*C_MEAN;

function localNow(tz){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const get = t => parts.find(p=>p.type===t).value;
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(get("weekday"));
  let h = +get("hour"); if(h===24) h=0;
  return {day:wd,min:h*60+ +get("minute")};
}
// returns {open:bool, closesIn:min|null}
function openAt(x,day,min){
  const prev = (day+6)%7;
  for(const seg of x.h.split(",")){
    const [s,e] = seg.split("-").map(toMin);
    if(e>s){ if(!x.x.includes(day) && min>=s && min<e) return {open:true,left:e-min}; }
    else { // overnight
      if(!x.x.includes(day) && min>=s) return {open:true,left:1440-min+e};
      if(!x.x.includes(prev) && min<e) return {open:true,left:e-min};
    }
  }
  return {open:false};
}
function hhmm(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }

const NEAR = "__near";
const locPt = () => [S.loc.lat,S.loc.lng];
function areaDist(a){ return S.loc ? km(locPt(),GEO[a]) : null; }
function nearAreas(){ return Object.keys(cityOf(S.country,S.city).areas).filter(a=>areaDist(a)<=S.radius); }
function curArea(){
  if(S.area===NEAR) return {th:`รอบ ${S.loc.label} · ${S.radius} กม.`,en:"",near:true};
  const a = cityOf(S.country,S.city).areas[S.area]; return {th:a[0],en:a[1],near:false};
}

const STEP_LABELS = ["ประเทศ","เมือง","ย่าน","ประเภท","เวลา","ผลลัพธ์"];

function pool(level){
  return R.filter(x=>{
    if(level>=1 && S.country && cityOf(S.country,x.c)===undefined) return false;
    if(level>=2 && S.city && x.c!==S.city) return false;
    if(level>=3 && S.area===NEAR && !nearAreas().includes(x.a)) return false;
    if(level>=3 && S.area && S.area!==NEAR && x.a!==S.area) return false;
    return true;
  });
}
function countryOf(x){ return Object.keys(COUNTRIES).find(k=>COUNTRIES[k].cities[x.c]); }

/* ---------- chrome ---------- */
function renderChrome(){
  const reach = [true,!!S.country,!!S.city,!!S.area,S.cuisines.length>0,S.meal!==null];
  $("#steps").innerHTML = STEP_LABELS.map((l,i)=>{
    const cls = i===S.step?"cur":(i<S.step?"done":"");
    const can = i<=S.step || reach.slice(0,i+1).every(Boolean);
    return `<button class="st ${cls}" data-go="${i}" ${can?"":"disabled"} aria-label="ขั้นที่ ${i+1} ${l}"><span class="bar"></span><span class="lb">${i+1} ${l}</span></button>`;
  }).join("");
  const cr = [];
  if(S.country) cr.push(COUNTRIES[S.country].name);
  if(S.city) cr.push(cityOf(S.country,S.city).name);
  if(S.area) cr.push(curArea().th);
  if(S.cuisines.length) cr.push(S.cuisines.length===Object.keys(CUISINES).length?"ทุกประเภท":S.cuisines.map(k=>CUISINES[k][1].split(" / ")[0]).join(", "));
  if(S.meal) cr.push(mealText());
  $("#crumbs").innerHTML = cr.map(c=>`<span class="crumb"><b>${esc(c)}</b></span>`).join("");
  $("#crumbs").hidden = cr.length===0;
}
function mealText(){
  const m = MEALS.find(m=>m.k===S.meal);
  if(S.meal==="any") return "ไม่ระบุเวลา";
  if(S.meal==="now") return "เปิดตอนนี้";
  return `${DAYS_FULL[S.day]} ${m.t}`;
}
function go(i){ S.step=i; render(); window.scrollTo({top:0,behavior:"smooth"}); }

  if(L){

}
function stepArea(){
  const ci = cityOf(S.country,S.city);
  let areas = Object.entries(ci.areas).map(([k,[th,en,desc]])=>{
    const rs = R.filter(x=>x.c===S.city&&x.a===k);
    const cz = [...new Set(rs.flatMap(x=>x.k))].map(c=>CUISINES[c][1]).join(" ");
    return {k,th,en,desc,cz,n:rs.length,avg:rs.reduce((s,x)=>s+x.r,0)/rs.length,d:areaDist(k)};
  });
  const sortMode = S.areaSort || (S.loc?"near":"default");
  if(sortMode==="rating") areas.sort((a,b)=>b.avg-a.avg);
  if(sortMode==="near" && S.loc) areas.sort((a,b)=>a.d-b.d);
  let nearCard = "";
  if(S.loc){
    const na = nearAreas(); const nr = R.filter(x=>x.c===S.city&&na.includes(x.a));
    nearCard = `<button class="opt near ${S.area===NEAR?"sel":""}" data-area="${NEAR}" ${nr.length?"":"disabled"} data-text="ใกล้ รอบ near"><span class="big">รอบ ${esc(S.loc.label)}</span><span class="sub">ย่านใหม่จากตำแหน่ง · รัศมี ${S.radius} กม.</span>
      <span class="desc">${na.length?na.map(a=>ci.areas[a][0]).join(", "):"ยังไม่มีย่านในรัศมีนี้ ลองขยายรัศมี"}</span><span class="cnt">${nr.length} ร้าน</span></button>`;
  }
  const tgs = [["default","ตามแผนที่"],["rating","คะแนนสูงสุด"]].concat(S.loc?[["near","ใกล้สุด"]]:[]);
  return head(3,`ย่านไหนใน${ci.name}`,`${areas.length} ย่าน · ตัวเลขใต้ชื่อย่านคือคะแนนรีวิวเฉลี่ยของร้านในย่านนั้น`) +
  locPanel() +
  `<div class="areabar"><input id="areaq" type="search" placeholder="ค้นหาย่าน เช่น ราเมง, Shibuya, คาเฟ่" autocomplete="off" aria-label="ค้นหาย่าน">
    <div class="grp">${tgs.map(([k,l])=>`<button class="tg ${sortMode===k?"sel":""}" data-asort="${k}">${l}</button>`).join("")}</div></div>` +
  `<div class="grid" id="areagrid">${nearCard}${areas.map(a=>`<button class="opt ${S.area===a.k?"sel":""}" data-area="${a.k}" data-text="${esc((a.th+" "+a.en+" "+a.desc+" "+a.cz).toLowerCase())}"><span class="big">${a.th}</span><span class="sub">${a.en}</span>${a.d!==null?`<span class="dist ${a.d<=S.radius?"in":""}">${distTxt(a.d)}</span>`:""}<span class="desc">${a.desc}</span><span class="cnt">${a.n} ร้าน · เฉลี่ย ★ ${a.avg.toFixed(1)}</span></button>`).join("")}</div>
  <div class="empty" id="areaempty" hidden>ไม่เจอย่านที่ค้นหา ลองพิมพ์ชื่อภาษาอังกฤษหรือประเภทอาหาร</div>
  <div class="actions">${back()}</div>`;
}
function setLoc(lat,lng,label,extra={}){
  S.loc = {lat,lng,label,...extra}; S.locErr=""; S.areaSort=null;
  const nc = nearestCity([lat,lng]);
  S.locMove = (nc && nc.ci!==S.city && nc.d<40) ? {co:nc.co,ci:nc.ci} : null;
  if(nc && nc.d>=40) S.locErr = `ตำแหน่งนี้ห่างจากย่านที่มีในแอปเกิน 40 กม. ระยะทางที่แสดงอาจไม่มีประโยชน์`;
  if(S.area===NEAR) S.cuisines=[];
}
function stepCuisine(){
  const rs = pool(3);
  const counts = {};
  rs.forEach(x=>x.k.forEach(k=>counts[k]=(counts[k]||0)+1));
  const keys = Object.keys(CUISINES).filter(k=>counts[k]);
  const all = keys.length && keys.every(k=>S.cuisines.includes(k));
  return head(4,"อยากกินอะไร","เลือกได้มากกว่า 1 ประเภท แสดงเฉพาะประเภทที่มีในย่านนี้") +
  `<div class="chips"><button class="chip ${all?"sel":""}" data-allc="1">ทุกประเภท<small>${rs.length}</small></button></div>
   <div class="grid">${keys.map(k=>`<button class="opt ${S.cuisines.includes(k)?"sel":""}" data-cuisine="${k}"><span class="ico" aria-hidden="true">${CUISINES[k][0]}</span><span class="big">${CUISINES[k][1]}</span><span class="cnt">${counts[k]} ร้าน</span></button>`).join("")}</div>
   <div class="actions">${back()}<button class="btn primary" data-next="4" ${S.cuisines.length?"":"disabled"}>ถัดไป: เลือกเวลา →</button></div>`;
}
function stepTime(){
  const tz = COUNTRIES[S.country].tz;
  const now = localNow(tz);
  if(S.day===null) S.day = now.day;
  const needDay = S.meal && !["now","any"].includes(S.meal);
  return head(5,"ไปกินตอนไหน",`เวลาท้องถิ่นที่${cityOf(S.country,S.city).name}ตอนนี้ ${DAYS_FULL[now.day]} ${hhmm(now.min)} น. — ระบบจะเช็กว่าร้านเปิดหรือปิดในเวลาที่เลือก`) +
  `<div class="grid">${MEALS.map(m=>`<button class="opt ${S.meal===m.k?"sel":""}" data-meal="${m.k}"><span class="big">${m.lb}</span><span class="sub">${m.sub}</span></button>`).join("")}</div>
   <div class="row-label" ${needDay?"":"hidden"}>วัน</div>
   <div class="chips" ${needDay?"":"hidden"}>${DAYS.map((d,i)=>`<button class="chip ${S.day===i?"sel":""}" data-day="${i}">${d}${i===now.day?"<small>วันนี้</small>":""}</button>`).join("")}</div>
   <div class="actions">${back()}<button class="btn primary" data-next="5" ${S.meal?"":"disabled"}>ดูร้านแนะนำ →</button></div>`;
}

function stepResults(){
  const co = COUNTRIES[S.country], ci = cityOf(S.country,S.city), ar = curArea();
  let when = null;
  if(S.meal==="now") when = localNow(co.tz);
  else if(S.meal!=="any") when = {day:S.day,min:toMin(MEALS.find(m=>m.k===S.meal).t)};

  let rs = pool(3).filter(x=>x.k.some(k=>S.cuisines.includes(k)));
  rs = rs.map(x=>({...x,st:when?openAt(x,when.day,when.min):null,sm:smart(x)}));
  if(S.minR) rs = rs.filter(x=>x.r>=S.minR);
  if(S.resOnly) rs = rs.filter(x=>x.rs!=="no");
  if(S.openOnly && when) rs = rs.filter(x=>x.st.open);
  const sorters = {near:(a,b)=>areaDist(a.a)-areaDist(b.a)||b.sm-a.sm, smart:(a,b)=>b.sm-a.sm, rating:(a,b)=>b.r-a.r||b.v-a.v, reviews:(a,b)=>b.v-a.v, price:(a,b)=>a.p-b.p||b.sm-a.sm};
  rs.sort(sorters[S.sort]);
  if(when) rs.sort((a,b)=>(b.st.open?1:0)-(a.st.open?1:0));
  const nOpen = when?rs.filter(x=>x.st.open).length:rs.length;

  const cuiTxt = S.cuisines.map(k=>CUISINES[k][1].split(" / ")[0]).join(", ");
  const kw = (`${S.cuisines.length<=2?S.cuisines.map(k=>({ramen:"ramen",sushi:"sushi",grill:"bbq",izakaya:"izakaya",fried:"tempura tonkatsu",okonomi:"okonomiyaki",fine:"fine dining",donburi:"donburi",yoshoku:"curry",thai:"thai food",korean:"korean food",seafood:"seafood",street:"street food",cafe:"cafe",dessert:"dessert"}[k])).join(" "):"restaurants"}`);
  const mapsUrl = ar.near ? `https://www.google.com/maps/search/${encodeURIComponent(kw)}/@${S.loc.lat},${S.loc.lng},15z` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`best ${kw} ${ar.en} ${ci.en}`)}`;

  const tb = (key,val,lbl)=>`<button class="tg ${S[key]===val?"sel":""}" data-set="${key}" data-val="${val}">${lbl}</button>`;
  return `<div class="q"><span class="no">ผลลัพธ์</span>
      <p class="sumline"><em>${nOpen}</em> ร้าน${when?"ที่เปิด":""} · ${esc(cuiTxt)} · ${esc(ar.th)}, ${ci.name}</p>${S.loc&&!ar.near?`<p class="hint">ย่านนี้ห่างจาก ${esc(S.loc.label)} ${distTxt(areaDist(S.area))}</p>`:""}
      <p>${mealText()}${S.meal==="now"?` (${hhmm(when.min)} น. เวลาท้องถิ่น)`:""}</p></div>
    <div class="toolbar">
      <div class="grp"><span>เรียงตาม</span>${tb("sort","smart","แนะนำ")}${tb("sort","rating","คะแนน")}${tb("sort","reviews","รีวิวเยอะ")}${tb("sort","price","ราคาถูก")}${S.loc?tb("sort","near","ใกล้สุด"):""}</div>
      <div class="grp"><span>คะแนนขั้นต่ำ</span>${tb("minR",0,"ทั้งหมด")}${tb("minR",4.3,"4.3+")}${tb("minR",4.5,"4.5+")}</div>
      <div class="grp">${when?`<button class="tg ${S.openOnly?"sel":""}" data-flip="openOnly">เฉพาะที่เปิด</button>`:""}<button class="tg ${S.resOnly?"sel":""}" data-flip="resOnly">จองได้</button></div>
    </div>
    <p class="hint">“แนะนำ” ถ่วงคะแนนด้วยจำนวนรีวิว ร้าน ★4.8 จาก 40 รีวิวจะไม่แซงร้าน ★4.6 จาก 3,000 รีวิวง่าย ๆ</p>
    <div class="list">${rs.length?rs.map((x,i)=>card(x,i,co)).join(""):`<div class="empty">ไม่มีร้านตรงเงื่อนไข ลองลดคะแนนขั้นต่ำหรือเปลี่ยนเวลา</div>`}</div>
    <a class="maps" href="${mapsUrl}" target="_blank" rel="noopener">ค้นหาร้าน${esc(cuiTxt)}ของจริง${ar.near?`รอบ ${esc(S.loc.label)} `:`ในย่าน${esc(ar.th)}`}บน <b>Google Maps ↗</b></a>
    <p class="note">ข้อมูลร้าน เบอร์โทร และคะแนนในหน้านี้เป็นข้อมูลจำลองสำหรับทดลองรูปแบบแอป ถ้าจะใช้จริงให้เชื่อมกับ Google Places API หรือ Tabelog/Wongnai เพื่อดึงคะแนนรีวิวและเวลาเปิดปิดแบบสด</p>
    <div class="actions"><button class="btn ghost" data-go="4">← เปลี่ยนเวลา</button><button class="btn" data-reset="1">เริ่มค้นหาใหม่</button></div>`;
}

function card(x,i,co){
  const stars = "★".repeat(Math.round(x.r))+"☆".repeat(5-Math.round(x.r));
  let pill = "";
  if(x.st){
    if(x.st.open) pill = x.st.left<=60?`<span class="pill p-warn">ใกล้ปิด · อีก ${x.st.left} นาที</span>`:`<span class="pill p-ok">เปิดอยู่</span>`;
    else pill = `<span class="pill p-bad">ปิดเวลานี้</span>`;
  }
  const hours = x.h.split(",").map(s=>s.replace("-","–")).join(", ");
  const closed = x.x.length?` · หยุด${x.x.map(d=>DAYS[d]).join(" ")}`:" · เปิดทุกวัน";
  const [rl,rc] = RES[x.rs];
  return `<article class="card ${x.st&&!x.st.open?"closed":""}">
    <div class="c-head">
      <span class="rank">#${i+1}</span>
      <div><h3 class="c-name">${esc(x.n)}</h3>
        <div class="c-meta"><span>${x.k.map(k=>CUISINES[k][1].split(" / ")[0]).join(" · ")}</span><span>${co.cur.repeat(x.p)}<span style="opacity:.3">${co.cur.repeat(4-x.p)}</span></span>${pill}${S.loc?`<span class="dist ${areaDist(x.a)<=S.radius?"in":""}">${S.area===NEAR?esc(cityOf(S.country,S.city).areas[x.a][0])+" · ":""}${distTxt(areaDist(x.a)).split(" · ")[0]}</span>`:""}</div></div>
      <div class="score"><span class="num">${x.r.toFixed(1)}</span><span class="stars" aria-hidden="true">${stars}</span><span class="rv">${x.v.toLocaleString("en-US")} รีวิว</span></div>
    </div>
    <div class="facts">
      <div class="fact"><span class="k">เวลาเปิด–ปิด</span><span class="v mono">${hours}<span style="font-family:var(--f-body);font-size:12.5px;color:var(--ink-3)">${closed}</span></span></div>
      <div class="fact"><span class="k">โทร</span><span class="v tel"><span class="mono" style="font-family:var(--f-mono);font-size:13.5px">${esc(x.t)}</span><button class="copy" data-copy="${esc(x.t)}">คัดลอก</button></span></div>
      <div class="fact"><span class="k">การจอง</span><span class="v"><span class="pill ${rc}">${rl}</span>${x.rn?` <span style="font-size:13px;color:var(--ink-2)">${esc(x.rn)}</span>`:""}</span></div>
      <div class="fact"><span class="k">เมนูเด่น</span><span class="v">${esc(x.d)}</span></div>
    </div>
    <div class="c-foot"><div class="tags">${x.g.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <button class="fav ${favs.has(x.n)?"on":""}" data-fav="${esc(x.n)}" aria-label="บันทึกร้าน">${favs.has(x.n)?"♥":"♡"}</button></div>
  </article>`;
}

/* ---------- render + events ---------- */
function render(){
  renderChrome();
  const fns = [stepCountry,stepCity,stepArea,stepCuisine,stepTime,stepResults];
  $("#stage").innerHTML = fns[S.step]();
}
document.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.go!==undefined){ go(+d.go); return; }
  if(d.country){ if(S.country!==d.country){S.city=S.area=null;S.cuisines=[];S.day=null;} S.country=d.country; const cs=Object.keys(COUNTRIES[d.country].cities); if(cs.length===1){S.city=cs[0];go(2);} else go(1); return; }
  if(d.city){ if(S.city!==d.city){S.area=null;S.cuisines=[];} S.city=d.city; go(2); return; }
  if(d.area){ if(S.area!==d.area) S.cuisines=[]; S.area=d.area; go(3); return; }
  if(d.cuisine){ const i=S.cuisines.indexOf(d.cuisine); i>=0?S.cuisines.splice(i,1):S.cuisines.push(d.cuisine); render(); return; }
  if(d.allc){ const ks=[...new Set(pool(3).flatMap(x=>x.k))]; S.cuisines = ks.every(k=>S.cuisines.includes(k))?[]:ks; render(); return; }
  if(d.asort){ S.areaSort=d.asort; render(); return; }
  if(d.lm!==undefined){ const l=LANDMARKS[S.city][+d.lm]; setLoc(l[1],l[2],l[0],{lm:+d.lm}); render(); return; }
  if(d.my){ const m=myAreas.find(m=>String(m.id)===d.my); if(m){ setLoc(m.lat,m.lng,m.name,{myId:m.id}); S.area=NEAR; S.cuisines=[]; go(3);} return; }
  if(d.locgo){ const r=parseLoc($("#locq").value); if(r.err){S.locErr=r.err;} else setLoc(r.lat,r.lng,"จุดที่ปักหมุด"); render(); return; }
  if(d.locclear){ S.loc=null; S.locErr=""; S.locMove=null; S.areaSort=null; if(S.area===NEAR){S.area=null;S.cuisines=[];} render(); return; }
  if(d.radius){ S.radius=+d.radius; render(); return; }
  if(d.move){ const {co,ci}=S.locMove; Object.assign(S,{country:co,city:ci,area:null,cuisines:[],day:null,locMove:null}); S.loc={...S.loc,lm:undefined}; render(); return; }
  if(d.savemy){ const name=($("#myname").value.trim()||"ย่านของฉัน").slice(0,40); const id=Date.now();
    myAreas.push({id,city:S.city,name,lat:S.loc.lat,lng:S.loc.lng}); saveAreas(); S.loc={...S.loc,label:name,myId:id,lm:undefined}; render(); return; }
  if(d.delmy){ myAreas=myAreas.filter(m=>String(m.id)!==d.delmy); saveAreas(); S.loc={...S.loc,myId:undefined}; render(); return; }
  if(d.meal){ S.meal=d.meal; render(); return; }
  if(d.day!==undefined){ S.day=+d.day; render(); return; }
  if(d.next){ go(+d.next); return; }
  if(d.set){ S[d.set] = d.set==="sort"?d.val:+d.val; render(); return; }
  if(d.flip){ S[d.flip]=!S[d.flip]; render(); return; }
  if(d.fav){ favs.has(d.fav)?favs.delete(d.fav):favs.add(d.fav); saveFavs(); render(); return; }
  if(d.reset){ Object.assign(S,{step:0,country:null,city:null,area:null,cuisines:[],day:null,meal:null,minR:0,resOnly:false,openOnly:false,sort:"smart",areaSort:null,locMove:null}); render(); return; }
  if(d.copy){
    const done = ()=>{ b.textContent="คัดลอกแล้ว"; setTimeout(()=>b.textContent="คัดลอก",1500); };
    try{ navigator.clipboard.writeText(d.copy).then(done,()=>selectText(b)); }catch(err){ selectText(b); }
  }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if(e.target.id==="locq"){ e.preventDefault(); document.querySelector("[data-locgo]").click(); }
  if(e.target.id==="myname"){ e.preventDefault(); document.querySelector("[data-savemy]").click(); }
});
document.addEventListener("input",e=>{
  if(e.target.id!=="areaq") return;
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("#areagrid .opt").forEach(o=>{ const hit=!q||o.dataset.text.includes(q); o.hidden=!hit; if(hit) shown++; });
  $("#areaempty").hidden = shown>0;
});
function selectText(b){ const el=b.previousElementSibling; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

// เปิดมาในสถานะตัวอย่าง: ญี่ปุ่น › โตเกียว พร้อมให้เลือกย่าน
Object.assign(S,{country:"jp",city:"tokyo",step:2});
render();
</script>
