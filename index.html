const areaImgs={shinjuku:'https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=500&q=75',shibuya:'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=500&q=75',ginza:'https://images.unsplash.com/photo-1536098561742-ca998e48cbcc?auto=format&fit=crop&w=500&q=75',asakusa:'https://images.unsplash.com/photo-1528360983277-13d401cdc186?auto=format&fit=crop&w=500&q=75',ueno:'https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?auto=format&fit=crop&w=500&q=75'};
let state={page:'home',city:'tokyo',area:'shinjuku',cuisines:[],query:'',detail:null,openOnly:false};
let favs=new Set(JSON.parse(localStorage.getItem('kindee-favs')||'[]'));
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function city(){return COUNTRIES.jp.cities[state.city]} function pool(){return R.filter(x=>x.c===state.city)}
function emoji(x){let k=x.k[0];return CUISINES[k]?.[0]||'🍽️'}
function nav(){document.querySelector('#bottom').innerHTML=[['home','⌂','หน้าหลัก'],['search','⌕','ค้นหา'],['favorites','♡','รายการโปรด'],['settings','⚙','ตั้งค่า']].map(n=>`<button class="nav ${state.page===n[0]?'on':''}" data-nav="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('')}
function home(){let ars=Object.entries(city().areas).slice(0,6);return `<header class="top"><div class="brand">กินไหน<b>ดี</b></div><button class="iconbtn" data-nav="favorites">♡</button></header><section class="hero"><h1>กินไหน<span>ดี</span></h1><div class="eng">TOKYO<br>FOOD GUIDE</div><p>ร้านอร่อย ที่คุณไม่ควรพลาด</p><div class="search"><input id="q" placeholder="ค้นหาร้านอาหาร..."><button data-search>⌕</button></div></section><section class="section"><div class="sectionhead"><h2>ย่านยอดนิยม</h2><span class="muted">เลือกย่านที่อยากไป</span></div><div class="scroll">${ars.map(([k,a],i)=>`<button class="areaCard" data-area="${k}" style="background-image:linear-gradient(#0001,#0005),url('${areaImgs[k]||areaImgs.shinjuku}')"><b>${a[0]}</b><small>${a[1]}</small></button>`).join('')}</div></section><section class="section"><div class="sectionhead"><h2>อยากกินอะไร?</h2><span class="muted">เลือกได้หลายประเภท</span></div><div class="cuisines">${Object.entries(CUISINES).slice(0,8).map(([k,v])=>`<button class="cuisine" data-cui="${k}"><i>${v[0]}</i><span>${v[1].split(' / ')[0]}</span></button>`).join('')}</div></section>`}
function searchPage(){let ars=Object.entries(city().areas);return `<header class="top"><div class="brand">กินไหน<b>ดี</b></div><button class="iconbtn" data-nav="home">×</button></header><div class="pageTitle"><h1>ค้นหา</h1><p class="muted">เลือกย่านและประเภทอาหาร</p></div><section class="section"><div class="sectionhead"><h2>เลือกย่าน</h2></div><div class="areaGrid">${ars.map(([k,a])=>`<button class="areaPick ${state.area===k?'sel':''}" data-area-only="${k}" style="background-image:linear-gradient(#0002,#0008),url('${areaImgs[k]||areaImgs.shinjuku}')"><b>${a[0]}<br><small>${a[1]}</small></b></button>`).join('')}</div></section><section class="section"><div class="sectionhead"><h2>เลือกประเภทอาหาร</h2></div><div class="cuisines">${Object.entries(CUISINES).map(([k,v])=>`<button class="cuisine ${state.cuisines.includes(k)?'sel':''}" data-cui="${k}"><i>${v[0]}</i><span>${v[1].split(' / ')[0]}</span></button>`).join('')}</div><br><button class="primary" data-results>ดูร้านแนะนำ</button></section>`}
function results(){let list=pool().filter(x=>!state.area||x.a===state.area).filter(x=>!state.cuisines.length||x.k.some(k=>state.cuisines.includes(k))).filter(x=>!state.query||x.n.toLowerCase().includes(state.query.toLowerCase())); list.sort((a,b)=>b.r-a.r||b.v-a.v);return `<header class="top"><button class="iconbtn" data-nav="search">‹</button><div class="brand">ผลการค้นหา</div><button class="iconbtn">☷</button></header><div class="filters"><button class="filter sel">ทั้งหมด ${list.length}</button><button class="filter ${state.openOnly?'sel':''}" data-open>เปิดตอนนี้</button><button class="filter">เรตติ้งสูง</button><button class="filter" data-nav="search">ตัวกรอง</button></div>${list.length?list.map((x,i)=>`<article class="result" data-detail="${R.indexOf(x)}"><div class="thumb">${emoji(x)}</div><div><button class="fav" data-fav="${esc(x.n)}">${favs.has(x.n)?'♥':'♡'}</button><h3>${esc(x.n)}</h3><div><span class="rating">★ ${x.r}</span> <span class="muted">(${x.v.toLocaleString()} รีวิว)</span></div><div class="meta">${x.k.map(k=>CUISINES[k][1].split(' / ')[0]).join(' · ')} · ${'¥'.repeat(x.p)}<br>📍 ${city().areas[x.a]?.[0]||''}<br><span class="open">● เปิดตามเวลาที่ระบุ</span> · ${x.h.split(',')[0]}</div></div></article>`).join(''):`<div class="empty">ไม่พบร้านที่ตรงกับเงื่อนไข</div>`}<div class="section"><p class="note">ข้อมูลร้านในเวอร์ชันนี้เป็นข้อมูลตัวอย่าง ระบบไม่ใช้ API แบบเสียเงิน และปุ่มแผนที่จะเปิด Google Maps โดยตรง</p></div>`}
function detail(){let x=R[state.detail];if(!x)return results();let ar=city().areas[x.a];let q=encodeURIComponent(`${x.n} ${ar?.[1]||''} Tokyo`);return `<div class="detailHero"><button class="iconbtn back" data-nav="results">‹</button></div><section class="detail"><button class="fav" data-fav="${esc(x.n)}">${favs.has(x.n)?'♥':'♡'}</button><span class="pill">${x.k.map(k=>CUISINES[k][1].split(' / ')[0]).join(' · ')}</span><h1>${esc(x.n)}</h1><div><span class="rating">★ ${x.r}</span> <span class="muted">(${x.v.toLocaleString()} รีวิว) · ${'¥'.repeat(x.p)}</span></div><p class="meta">📍 ${ar?.[0]||''} · 🕒 ${x.h}<br>☎ ${esc(x.t)}</p><div class="actions4"><button class="action" onclick="location.href='tel:${x.t.replace(/\s/g,'')}'">☎<br>โทร</button><button class="action" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${q}','_blank')">⌖<br>แผนที่</button><button class="action">▣<br>จองโต๊ะ</button><button class="action" onclick="navigator.share&&navigator.share({title:'${esc(x.n)}',url:location.href})">↗<br>แชร์</button></div><div class="sectionhead"><h2>เมนูแนะนำ</h2><span class="muted">ดูทั้งหมด ›</span></div><div class="dishgrid"><div class="dish">${esc(x.d)}</div><div class="dish">เมนูยอดนิยม</div><div class="dish">เมนูแนะนำ</div></div><div class="sectionhead"><h2>รายละเอียด</h2></div><p>${esc(x.d)}</p><div>${x.g.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><br><button class="primary" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${q}','_blank')">📍 นำทางด้วย Google Maps</button></section>`}
function favorites(){let list=R.filter(x=>favs.has(x.n));return `<header class="top"><div class="brand">รายการโปรด</div><button class="iconbtn" data-nav="home">×</button></header><div class="pageTitle"><h1>ร้านที่บันทึกไว้</h1></div>${list.length?list.map(x=>`<article class="result" data-detail="${R.indexOf(x)}"><div class="thumb">${emoji(x)}</div><div><h3>${esc(x.n)}</h3><div class="rating">★ ${x.r}</div><div class="meta">${x.d}</div></div></article>`).join(''):`<div class="empty">ยังไม่มีร้านโปรด<br>กด ♡ ที่ร้านที่สนใจได้เลย</div>`}`}
function render(){let a=$('#app');if(state.page==='home')a.innerHTML=home();else if(state.page==='search')a.innerHTML=searchPage();else if(state.page==='results')a.innerHTML=results();else if(state.page==='detail')a.innerHTML=detail();else if(state.page==='favorites')a.innerHTML=favorites();else a.innerHTML=home();nav();scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-detail]');if(!b)return;if(b.dataset.nav){state.page=b.dataset.nav;render();return}if(b.dataset.area){state.area=b.dataset.area;state.page='search';render();return}if(b.dataset.areaOnly){state.area=b.dataset.areaOnly;render();return}if(b.dataset.cui){let k=b.dataset.cui,i=state.cuisines.indexOf(k);i<0?state.cuisines.push(k):state.cuisines.splice(i,1);render();return}if(b.dataset.results!==undefined){state.page='results';render();return}if(b.dataset.search!==undefined){state.query=$('#q')?.value||'';state.page='results';render();return}if(b.dataset.detail!==undefined){state.detail=+b.dataset.detail;state.page='detail';render();return}if(b.dataset.fav){e.stopPropagation();favs.has(b.dataset.fav)?favs.delete(b.dataset.fav):favs.add(b.dataset.fav);localStorage.setItem('kindee-favs',JSON.stringify([...favs]));render();return}if(b.dataset.open!==undefined){state.openOnly=!state.openOnly;render();return}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){state.query=e.target.value;state.page='results';render()}});render();
</script></body></html>
