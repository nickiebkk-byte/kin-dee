<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>กินไหนดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<script src="https://maps.googleapis.com/maps/api/js?key=PASTE_YOUR_API_KEY_HERE&libraries=places&loading=async"></script>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#101010;--muted:#827e75;--line:#ddd8cc;--yellow:#ffd43b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,sans-serif}
.top{position:sticky;top:0;z-index:10;background:rgba(247,245,239,.95);backdrop-filter:blur(12px);border-bottom:1px solid #e6e1d7}
.topin{max-width:980px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{font-size:38px;font-weight:800;letter-spacing:-2px}.logo b{background:var(--yellow);padding:2px 7px}.live{font-size:13px;color:#6f6a61;text-align:right}
main{max-width:980px;margin:auto;padding:26px 22px 80px}.step{font-weight:700;color:#8b7512;font-size:14px}.hero h1{font-size:clamp(34px,8vw,58px);line-height:1.06;margin:8px 0 12px;letter-spacing:-2px}.hero p{margin:0 0 28px;color:#6f6a61;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;min-height:170px;box-shadow:0 2px 0 rgba(0,0,0,.03)}
button.card{font:inherit;text-align:left;color:inherit;cursor:pointer}.card:hover,.card.sel{border-color:#111;box-shadow:0 0 0 1px #111}.big{display:block;font-size:23px;font-weight:800}.sub{display:block;color:#8a867e;margin-top:4px}.desc{display:block;color:#5f5b54;margin-top:18px;font-size:14px}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px}.btn{border:1px solid #111;background:#fff;border-radius:999px;padding:13px 18px;font:600 14px Prompt;cursor:pointer}.primary{background:#111;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 24px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:600 14px Prompt}.chip.sel{background:#111;color:#fff;border-color:#111}
.result{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:12px}.rhead{display:flex;gap:12px;justify-content:space-between}.rname{font-size:20px;font-weight:800}.score{font-weight:800;font-size:20px;white-space:nowrap}.meta,.addr,.hours{color:#6f6a61;font-size:13px;margin-top:6px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{background:#f1efe9;border-radius:999px;padding:6px 9px;font-size:12px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.links a{color:#111;text-decoration:none;border:1px solid #111;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:700}
.loading,.empty{padding:35px;text-align:center;border:1px dashed #bbb4a8;border-radius:22px;color:#706b63}.error{background:#fff2f0;border:1px solid #efb3ab;padding:16px;border-radius:18px;color:#8b2f25}.note{font-size:12px;color:#888278;margin-top:18px}
@media(max-width:600px){.topin{padding:16px 18px}.logo{font-size:34px}main{padding:24px 18px 70px}.grid{grid-template-columns:1fr 1fr;gap:12px}.card{padding:18px;min-height:155px}.big{font-size:20px}.hero h1{font-size:43px}.live{max-width:145px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}.live{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="logo">กินไหน<b>ดี</b></div><div class="live">LIVE · GOOGLE PLACES</div></div></header>
<main id="app"></main>
<script>
const COUNTRIES={
 jp:{th:"ญี่ปุ่น",en:"Japan",cities:{tokyo:{th:"โตเกียว",en:"Tokyo",areas:["Shinjuku","Shibuya","Ginza","Asakusa","Ueno","Ikebukuro"]},osaka:{th:"โอซาก้า",en:"Osaka",areas:["Namba","Dotonbori","Umeda","Shinsekai","Tenma"]}}},
 th:{th:"ไทย",en:"Thailand",cities:{bkk:{th:"กรุงเทพฯ",en:"Bangkok",areas:["Siam","Charoen Krung","Banglamphu","Chatuchak","Ratchada"]},cnx:{th:"เชียงใหม่",en:"Chiang Mai",areas:["Old City","Nimman","Night Bazaar","Santitham"]}}},
 kr:{th:"เกาหลีใต้",en:"South Korea",cities:{seoul:{th:"โซล",en:"Seoul",areas:["Gangnam","Seongsu","Itaewon","Insadong","Gwangjang Market"]}}}
};
const CUISINES=["อาหารท้องถิ่น","ซูชิ","ราเมง","ปิ้งย่าง / BBQ","อาหารทะเล","Street Food","คาเฟ่","ของหวาน","Fine Dining","อิซากายะ"];
let S={step:0,country:null,city:null,area:null,cuisines:[]};
const app=document.querySelector("#app"), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function head(n,t,s){return `<section class="hero"><span class="step">ขั้นที่ ${n} / 4</span><h1>${t}</h1><p>${s||""}</p></section>`}
function back(){return `<button class="btn" onclick="S.step--;render()">← ย้อนกลับ</button>`}
function render(){
 if(S.step===0){app.innerHTML=head(1,"อยากไปกินที่ประเทศไหน","เลือกประเทศก่อน แล้วค่อยเจาะลงเมืองและย่าน")+`<div class="grid">${Object.entries(COUNTRIES).map(([k,v])=>`<button class="card" onclick="S.country='${k}';S.step=1;render()"><span class="big">${v.th}</span><span class="sub">${v.en} · ${Object.keys(v.cities).length} เมือง</span><span class="desc">ค้นหาร้านจริงจาก Google Places</span></button>`).join("")}</div>`;return}
 const co=COUNTRIES[S.country];
 if(S.step===1){app.innerHTML=head(2,`เมืองไหนใน${co.th}`,"เลือกเมืองที่ต้องการ")+`<div class="grid">${Object.entries(co.cities).map(([k,v])=>`<button class="card" onclick="S.city='${k}';S.step=2;render()"><span class="big">${v.th}</span><span class="sub">${v.en}</span><span class="desc">${v.areas.length} ย่าน</span></button>`).join("")}</div><div class="actions">${back()}</div>`;return}
 const ci=co.cities[S.city];
 if(S.step===2){app.innerHTML=head(3,`ย่านไหนใน${ci.th}`,"เลือกย่านที่จะไปกิน")+`<div class="grid">${ci.areas.map(a=>`<button class="card" onclick="S.area=${JSON.stringify(a)};S.step=3;render()"><span class="big">${a}</span><span class="sub">${ci.en}</span><span class="desc">ค้นหาร้านจริงในย่านนี้</span></button>`).join("")}</div><div class="actions">${back()}</div>`;return}
 if(S.step===3){app.innerHTML=head(4,"อยากกินอะไร","เลือกได้มากกว่า 1 ประเภท")+`<div class="chips">${CUISINES.map((c,i)=>`<button class="chip ${S.cuisines.includes(c)?"sel":""}" onclick="toggleCuisine(${i})">${c}</button>`).join("")}</div><div class="actions">${back()}<button class="btn primary" ${S.cuisines.length?"":"disabled"} onclick="searchPlaces()">ค้นหาร้านจริง →</button></div>`;return}
}
function toggleCuisine(i){const c=CUISINES[i],p=S.cuisines.indexOf(c);p>=0?S.cuisines.splice(p,1):S.cuisines.push(c);render()}
async function searchPlaces(){
 S.step=4; app.innerHTML=head("","กำลังหาร้านที่น่าสนใจ",`${esc(S.area)} · ${esc(COUNTRIES[S.country].cities[S.city].th)}`)+`<div class="loading">กำลังดึงข้อมูลสดจาก Google Places…</div>`;
 try{
   if(!window.google?.maps?.importLibrary) throw new Error("Google Maps ยังโหลดไม่สำเร็จ หรือ API Key ยังไม่ได้ใส่");
   const {Place}=await google.maps.importLibrary("places");
   const co=COUNTRIES[S.country],ci=co.cities[S.city];
   const q=`${S.cuisines.join(" OR ")} restaurants in ${S.area}, ${ci.en}, ${co.en}`;
   const {places}=await Place.searchByText({
     textQuery:q,
     fields:["id","displayName","formattedAddress","rating","userRatingCount","priceLevel","regularOpeningHours","currentOpeningHours","nationalPhoneNumber","googleMapsURI","types","businessStatus"],
     maxResultCount:20
   });
   showResults(places||[]);
 }catch(e){
   app.innerHTML=head("","เชื่อม Google Places ไม่สำเร็จ","ตรวจ API Key / Billing / API restrictions")+`<div class="error"><b>รายละเอียด:</b> ${esc(e.message||e)}</div><div class="actions"><button class="btn" onclick="S.step=3;render()">← กลับไปเลือกอาหาร</button></div>`;
 }
}
function hoursText(p){
 const h=p.currentOpeningHours||p.regularOpeningHours;
 if(!h) return "Google ไม่มีข้อมูลเวลาเปิด–ปิด";
 if(Array.isArray(h.weekdayDescriptions)) return h.weekdayDescriptions.join(" · ");
 return "มีข้อมูลเวลาเปิด–ปิดบน Google Maps";
}
function priceText(v){
 if(!v) return "";
 const m={FREE:"ฟรี",INEXPENSIVE:"฿",MODERATE:"฿฿",EXPENSIVE:"฿฿฿",VERY_EXPENSIVE:"฿฿฿฿"};
 return m[String(v).replace("PRICE_LEVEL_","")]||String(v);
}
function showResults(ps){
 ps=ps.filter(p=>p.businessStatus!=="CLOSED_PERMANENTLY").sort((a,b)=>(b.rating||0)-(a.rating||0)||(b.userRatingCount||0)-(a.userRatingCount||0));
 const co=COUNTRIES[S.country],ci=co.cities[S.city];
 app.innerHTML=head("",`${ps.length} ร้านจาก Google Places`,`${esc(S.cuisines.join(", "))} · ${esc(S.area)}, ${ci.th}`)+
 (ps.length?ps.map((p,i)=>`<article class="result"><div class="rhead"><div><div class="rname">#${i+1} ${esc(p.displayName||"ไม่ระบุชื่อ")}</div><div class="meta">${priceText(p.priceLevel)} ${p.userRatingCount?`· ${Number(p.userRatingCount).toLocaleString()} รีวิว`:""}</div></div><div class="score">${p.rating?`★ ${Number(p.rating).toFixed(1)}`:"—"}</div></div><div class="addr">${esc(p.formattedAddress||"")}</div><div class="hours">${esc(hoursText(p))}</div><div class="links">${p.nationalPhoneNumber?`<a href="tel:${esc(p.nationalPhoneNumber)}">โทร ${esc(p.nationalPhoneNumber)}</a>`:""}${p.googleMapsURI?`<a href="${esc(p.googleMapsURI)}" target="_blank" rel="noopener">Google Maps ↗</a>`:""}</div></article>`).join(""):`<div class="empty">ไม่พบร้าน ลองเลือกประเภทอาหารให้น้อยลงหรือเปลี่ยนย่าน</div>`)+
 `<p class="note">ข้อมูลชื่อร้าน ที่อยู่ คะแนน รีวิว เวลาเปิด–ปิด และเบอร์โทรมาจาก Google Places ตามข้อมูลที่ Google มีสำหรับแต่ละร้าน</p><div class="actions"><button class="btn" onclick="S.step=3;render()">← เปลี่ยนประเภท</button><button class="btn primary" onclick="S={step:0,country:null,city:null,area:null,cuisines:[]};render()">เริ่มใหม่</button></div>`;
}
render();
</script>
</body>
</html>
