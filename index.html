<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1eeff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="กินไหนดี">
<title>กินไหนดี</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ===== MY TRIP theme: Lavender + การ์ดมีมิติ ===== */
:root{
  color-scheme:light;
  --bg:#f1eeff; --blob1:#ddd6fe; --blob2:#fbcfe8; --blob3:#e0e7ff;
  --card:#ffffff; --inner:#f7f5ff; --cardline:#e7e1fb; --line:#e2dbfb;
  --glass:rgba(241,238,255,.82);
  --ink:#1e293b; --ink-2:#475569; --ink-3:#94a3b8; --text:#334155;
  --blue:#2563eb; --blue-a:#3b82f6; --blue-b:#1d4ed8; --blue-soft:#dbeafe;
  --yellow:#facc15; --yellow-a:#fde047; --amber:#fcd34d;
  --violet:#6d28d9; --violet-soft:#ede9fe;
  --ok:#059669; --ok-soft:#d1fae5; --warn:#b45309; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2;
  --shadow:rgba(109,40,217,.20); --heroshadow:rgba(76,29,149,.55);
  --depth:0 1px 0 rgba(255,255,255,.8) inset,0 1px 2px rgba(15,23,42,.05),0 6px 14px -6px rgba(15,23,42,.10),0 22px 40px -18px var(--shadow);
  --depth-sm:0 1px 0 rgba(255,255,255,.9) inset,0 3px 8px -4px rgba(15,23,42,.12);
  --f:"Prompt",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;letter-spacing:-.01em}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.55;padding-inline:14px;padding-block:0 calc(56px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 30% at 15% 10%,var(--blob1),transparent 70%),radial-gradient(45% 35% at 90% 35%,var(--blob2),transparent 70%),radial-gradient(40% 30% at 30% 85%,var(--blob3),transparent 70%)}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

/* header */
.top{position:sticky;top:0;z-index:20;margin-inline:-14px;padding:max(10px,env(safe-area-inset-top,0px)) 14px 10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(15,23,42,.35)}
.top-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--blue-a),var(--blue-b));box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 20px -10px rgba(37,99,235,.7);flex:none}
.brand h1{margin:0;font-size:19px;font-weight:700;color:var(--ink);line-height:1.1}
.brand h1 span{background:var(--yellow);padding:0 6px;border-radius:6px;margin-left:2px}
.sample{font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.live{color:var(--ok)}
.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:middle;box-shadow:0 0 0 3px var(--ok-soft)}
.brand-r{display:flex;align-items:center;gap:8px}
.setbtn{width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:var(--ink-2);display:grid;place-items:center;box-shadow:var(--depth-sm)}
.setbtn.sel{background:var(--ink);color:#fff}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.st{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:left;min-width:0}
.st .bar{height:5px;border-radius:3px;background:#ddd6fe}
.st.done .bar{background:var(--blue)}
.st.cur .bar{background:var(--yellow);box-shadow:0 0 0 1px #eab308 inset}
.st .lb{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.done .lb{color:var(--ink-2)}
.st.cur .lb{color:var(--ink);font-weight:700}
.st:disabled{cursor:default}
.crumbs{display:none}

/* stage */
.stage{padding-top:16px;display:flex;flex-direction:column;gap:14px}

/* hero (การ์ดมืดแบบ MY TRIP) */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 20px;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  background:radial-gradient(120% 90% at 100% 0%,rgba(139,92,246,.55),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(37,99,235,.45),transparent 60%),linear-gradient(160deg,#1e1b4b,#0f172a);
  box-shadow:0 2px 4px rgba(15,23,42,.12),0 28px 50px -20px var(--heroshadow)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.08)}
.hero-ico{position:absolute;right:-8px;top:-10px;font-size:120px;color:rgba(255,255,255,.07);transform:rotate(-12deg);pointer-events:none}
.kick{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:6px}
.kick i{font-size:9px}
.hero h2{margin:0;font-size:clamp(26px,7vw,36px);font-weight:700;line-height:1.15;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero h2 em{font-style:normal;color:var(--yellow)}
.hero p{margin:0;color:#cbd5e1;font-size:14px;max-width:60ch}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.pills span{font-size:12px;font-weight:500;padding:2px 11px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);color:#e2e8f0;backdrop-filter:blur(6px)}
.pills span.hl{color:var(--yellow);font-weight:700}

/* option cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.opt{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);border:1px solid var(--cardline);border-radius:22px;padding:16px 16px 14px;box-shadow:var(--depth);transition:transform .15s,box-shadow .15s}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:scale(.98)}
.opt .big{font-size:18px;font-weight:700;color:var(--ink);line-height:1.3}
.opt .sub{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.opt .desc{font-size:13px;color:var(--ink-2);margin-top:6px}
.opt .cnt{font-size:12px;font-weight:600;color:var(--violet);margin-top:8px}
.opt .ico{font-size:26px;line-height:1;margin-bottom:8px}
.opt.sel{background:linear-gradient(160deg,var(--blue-a),var(--blue-b));border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 14px 28px -12px rgba(37,99,235,.65)}
.opt.sel .big,.opt.sel .desc,.opt.sel .cnt,.opt.sel .dist{color:#fff}
.opt.sel .sub{color:#bfdbfe}
.opt.sel::after{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-size:11px}
.opt.near{background:linear-gradient(160deg,var(--yellow-a),var(--yellow));border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 14px 28px -12px rgba(202,138,4,.6)}
.opt.near .sub,.opt.near .desc{color:#713f12}
.opt.near .cnt{color:var(--ink)}
.opt.near.sel{background:linear-gradient(160deg,var(--blue-a),var(--blue-b))}
.opt:disabled{opacity:.5;cursor:not-allowed;transform:none}

.row-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--cardline);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;box-shadow:var(--depth-sm);color:var(--ink)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.6;font-size:11px;margin-left:4px}
.chip.mine{border-color:#c4b5fd;color:var(--violet)}
.chip.mine.sel{background:var(--violet);color:#fff}
.chip.gpschip{background:linear-gradient(160deg,var(--blue-a),var(--blue-b));color:#fff;border-color:transparent;font-weight:600}

.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-top:4px}
.btn{border-radius:999px;padding:11px 20px;font-weight:600;font-size:14px;border:1px solid var(--cardline);background:#fff;color:var(--ink);box-shadow:var(--depth-sm)}
.btn.primary{background:linear-gradient(160deg,var(--yellow-a),var(--yellow));border-color:transparent;color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 22px -10px rgba(202,138,4,.7)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--violet);padding-inline:4px}
.btn.more{align-self:center;width:100%;max-width:360px}
.btn.more span{font-weight:400;color:var(--ink-3);font-size:13px}

/* panels */
.gps{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(160deg,var(--blue-a),var(--blue-b));box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 14px 28px -12px rgba(37,99,235,.65)}
.gps-ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:20px;flex:none}
.gps>div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 180px}
.gps b{font-size:18px;font-weight:700}
.gps span{font-size:13px;color:#dbeafe}
.gps .btn.primary{flex:1 1 100%}
.locbox,.settings{background:var(--card);border:1px solid var(--cardline);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--depth)}
.settings{border:2px solid var(--violet)}
.loc-h{display:flex;flex-direction:column;gap:2px}
.loc-h b{font-size:16px;font-weight:700;color:var(--ink)}
.loc-h b i{color:var(--violet);margin-right:4px}
.loc-h span{font-size:13px;color:var(--ink-2)}
.locbox .chip{font-size:13px;padding:5px 12px}
.locin,.savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.locin input,.savebar input,.settings input,.areabar input{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--inner);border:1px solid var(--cardline);border-radius:14px;padding:10px 14px}
.locin .btn,.savebar .btn{padding:9px 16px}
.err{margin:0;font-size:13px;color:var(--bad)}
.hint{margin:0;font-size:12.5px;color:var(--ink-3)}
.locnow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:14px;background:var(--inner);border:1px solid var(--cardline);border-radius:14px;padding:8px 12px;box-shadow:var(--depth-sm)}
.mono{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.move{font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.radius,.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.radius>span,.grp>span{font-size:12px;color:var(--ink-3)}
.tg{background:#fff;border:1px solid var(--cardline);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.tg.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.areabar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dist{font-size:12px;font-weight:600;color:var(--ink-3)}
.dist.in{color:var(--blue)}
.howto{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.howto a{color:var(--violet);font-weight:600}
.howto code{font-family:var(--mono);font-size:12px;background:var(--inner);padding:0 4px;border-radius:4px;overflow-wrap:anywhere}

/* results */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 14px;background:var(--inner);border:1px solid var(--cardline);border-radius:20px;box-shadow:var(--depth-sm)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--cardline);border-radius:24px;box-shadow:var(--depth);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.closed{opacity:.6}
.card.sk{height:150px;background:linear-gradient(90deg,#fff 0%,var(--inner) 50%,#fff 100%);background-size:200% 100%;animation:shim 1.4s ease-in-out infinite}
@keyframes shim{to{background-position:-200% 0}}
.c-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.rank{font-size:12px;font-weight:700;color:var(--ink-3);min-width:30px;height:30px;border-radius:10px;background:var(--inner);display:grid;place-items:center}
.rank.rk1{background:linear-gradient(160deg,var(--yellow-a),var(--yellow));color:var(--ink);box-shadow:0 6px 12px -6px rgba(202,138,4,.8)}
.rank.inl{display:inline-grid;min-width:26px;height:22px;border-radius:7px;font-size:11px;margin-bottom:4px}
.thumb{width:68px;height:68px;border-radius:16px;object-fit:cover;background:var(--inner);box-shadow:var(--depth-sm)}
.c-name{font-weight:700;font-size:18px;line-height:1.3;margin:0;color:var(--ink)}
.c-meta{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px;padding:8px 8px 6px;border-radius:16px;color:#fff;background:linear-gradient(160deg,var(--blue-a),var(--blue-b));box-shadow:0 10px 18px -10px rgba(37,99,235,.8)}
.score .num{font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.score .stars{color:var(--yellow);font-size:9px;letter-spacing:1px;margin-top:3px}
.score .rv{font-size:10.5px;color:#dbeafe;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--inner);color:var(--ink-3)}
.dim{opacity:.3}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--inner);border:1px solid var(--cardline);border-radius:18px;padding:12px 14px;box-shadow:var(--depth-sm)}
.fact{display:flex;flex-direction:column;gap:1px;min-width:0}
.fact .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fact .v{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.fact .v.mono,.fact .mono{font-family:var(--mono);font-size:13px;color:var(--ink)}
.fact .v.small{font-size:13px;color:var(--ink-2)}
.v-note{font-family:var(--f);font-size:12.5px;color:var(--ink-3)}
.tel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copy{font-size:11.5px;border:1px solid var(--cardline);background:#fff;border-radius:999px;padding:0 9px}
details{font-size:12.5px;color:var(--ink-2)}
details summary{cursor:pointer;color:var(--violet);font-size:12px;font-weight:600}
.wk{margin:4px 0 0;padding-left:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;color:var(--violet);background:var(--violet-soft);border-radius:999px;padding:2px 10px}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--cardline);border-radius:999px;padding:6px 12px;box-shadow:var(--depth-sm)}
.links a.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.fav{background:#fff;border:1px solid var(--cardline);width:36px;height:36px;border-radius:50%;font-size:17px;line-height:1;color:var(--ink-3);flex:none}
.fav.on{color:#e11d48;border-color:#fecdd3;background:#fff1f2}
.credit{margin:-4px 0 0;font-size:11px;color:var(--ink-3)}
.empty{background:var(--card);border:1px dashed #c4b5fd;border-radius:22px;padding:24px;text-align:center;color:var(--ink-2)}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid #ddd6fe;border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.maps{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--cardline);border-radius:20px;padding:13px 16px;color:var(--ink);text-decoration:none;font-size:14px;box-shadow:var(--depth-sm)}
.maps i{color:var(--blue)}
.maps b{color:var(--violet)}
.note{font-size:12.5px;color:var(--ink-3);border-left:3px solid #c4b5fd;padding-left:10px;margin:0}

@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .opt{padding:14px 13px 12px;border-radius:20px}
  .opt .big{font-size:16.5px}
  .facts{grid-template-columns:1fr}
  .st .lb{font-size:9.5px}
  .c-head{gap:10px}
  .thumb{width:56px;height:56px;border-radius:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo"><span class="logo-ico"><i class="fa-solid fa-utensils"></i></span>
        <div><h1>กินไหน<span>ดี</span></h1><div class="sample" id="modeLbl"></div></div></div>
      <div class="brand-r"><button class="setbtn" id="setBtn" aria-label="ตั้งค่า"><i class="fa-solid fa-gear"></i></button></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="crumbs" id="crumbs"></div>
  </div>
</div>
<main class="wrap"><div class="stage" id="stage"></div></main>
<script>
/* ---------- master data (ตัวอย่าง) ---------- */
const COUNTRIES = {
  jp:{name:"ญี่ปุ่น",en:"Japan",tz:"Asia/Tokyo",cur:"¥",cities:{
    tokyo:{name:"โตเกียว",en:"Tokyo",areas:{
      shinjuku:["ชินจูกุ","Shinjuku","ราเมง อิซากายะ ชีวิตกลางคืน"],
      shibuya:["ชิบูย่า","Shibuya","ยากินิคุ ร้านเปิดดึก คาเฟ่"],
      harajuku:["ฮาราจุกุ / โอโมเตะซันโด","Harajuku","ของหวานเทรนด์ใหม่ กิวคัตสึ"],
      ebisu:["เอบิสุ / ไดคังยามะ","Ebisu","ร้านเก๋ ตรอกโยโกโจ ของหวาน"],
      nakameguro:["นากาเมกุโระ","Nakameguro","ริมคลองเมกุโระ คาเฟ่ ยากิโทริ"],

function km(a,b){ const R=6371,rad=x=>x*Math.PI/180; const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

  let m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || s.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);

}

function openReal(x,day,min){
  if(!x.periods||!x.periods.length) return {open:null};
  const t=day*1440+min, W=10080;
  for(const p of x.periods){
    if(!p.close) return {open:true,left:null};
    const s=p.open.day*1440+p.open.hour*60+p.open.minute;
    let e=p.close.day*1440+p.close.hour*60+p.close.minute; if(e<=s) e+=W;
    for(const tt of [t,t+W]) if(tt>=s&&tt<e) return {open:true,left:e-tt};
  }
  return {open:false};
}

const cache=new Map();
async function fetchReal(center,radiusM,cuis){
  const ck=JSON.stringify([center.lat.toFixed(4),center.lng.toFixed(4),radiusM,[...cuis].sort()]);

  await loadGoogle();
  const {Place}=await google.maps.importLibrary("places");

  const res=await Promise.all(qs.map(k=>Place.searchByText({
    textQuery:"best "+CUISINE_Q[k], fields:FIELDS, rankPreference:"RELEVANCE", locationBias:{center,radius:Math.min(radiusM,50000)}, maxResultCount:20, language:"th"
  }).then(r=>({k,places:r.places||[]}))));
  const map=new Map();
  for(const {k,places} of res) for(const p of places){
    if(p.businessStatus && String(p.businessStatus)!=="OPERATIONAL") continue;
    if(!p.location) continue;
    const lat=p.location.lat(), lng=p.location.lng();
    const d=km([center.lat,center.lng],[lat,lng]);
    if(d*1000>radiusM*1.25) continue;
    if(map.has(p.id)){ const e=map.get(p.id); if(k!=="_all"&&!e.k.includes(k)) e.k.push(k); continue; }
    const ph=p.photos&&p.photos[0];
    let photo=""; try{ photo=ph?ph.getURI({maxWidth:240,maxHeight:240}):""; }catch(e){}
    map.set(p.id,{real:true,id:p.id,n:p.displayName||"",k:k==="_all"?[]:[k],type:p.primaryTypeDisplayName||"",r:p.rating||0,v:p.userRatingCount||0,
      p:PRICE[String(p.priceLevel||"").toUpperCase()]||0,periods:p.regularOpeningHours?p.regularOpeningHours.periods:null,
      wd:p.regularOpeningHours?p.regularOpeningHours.weekdayDescriptions:null,off:p.utcOffsetMinutes,
      t:p.internationalPhoneNumber||p.nationalPhoneNumber||"",resv:p.reservable,maps:p.googleMapsURI||"",addr:p.formattedAddress||"",
      web:p.websiteURI||"",photo,photoBy:ph&&ph.authorAttributions&&ph.authorAttributions[0]?ph.authorAttributions[0].displayName:"",lat,lng});
  }
  const out={list:[...map.values()],calls:qs.length};

}

  S.realLoading=key; S.show=10;
  fetchReal(q.c,q.rm,q.cu)
    .then(out=>{ if(S.realLoading===key) S.real={key,...out,center:q.c,rm:q.rm}; })
    .catch(e=>{ if(S.realLoading===key) S.real={key,err:"ค้นหาไม่สำเร็จ: "+(e&&e.message?e.message:e)}; })
    .finally(()=>{ if(S.realLoading===key){ S.realLoading=null; if(S.step===5) render(); } });
  return null;
}

/* ---------- ตำแหน่ง ---------- */
function useGPS(){
  if(!navigator.geolocation){ S.locErr="อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับ GPS ให้วางพิกัดแทน"; render(); return; }
  S.gpsBusy=true; S.locErr=""; render();
  navigator.geolocation.getCurrentPosition(pos=>{
    S.gpsBusy=false; applyPoint(pos.coords.latitude,pos.coords.longitude,"ตำแหน่งปัจจุบัน");
  },err=>{
    S.gpsBusy=false;
    S.locErr = err.code===1 ? "ยังไม่ได้อนุญาตให้ใช้ตำแหน่ง เปิดสิทธิ์ Location ของเบราว์เซอร์แล้วกดใหม่"
      : "หาตำแหน่งไม่ได้ ลองอีกครั้ง หรือวางพิกัดจาก Google Maps แทน";
    render();
  },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
function applyPoint(lat,lng,label){
  const nc=nearestCity([lat,lng]);
  if(nc&&nc.d<40){ if(S.city!==nc.ci){ S.country=nc.co; S.city=nc.ci; S.day=null; } }
  else {
    S.country=null; S.city=null; S.day=null;
  }
  S.loc={lat,lng,label}; S.locErr=""; S.locMove=null; S.areaSort=null;
  S.area=NEAR; S.cuisines=[]; go(3);
}
function setLoc(lat,lng,label,extra={}){
  S.loc={lat,lng,label,...extra}; S.locErr=""; S.areaSort=null;
  const nc=nearestCity([lat,lng]);
  S.locMove=(nc&&nc.ci!==S.city&&nc.d<40)?{co:nc.co,ci:nc.ci}:null;
  if(nc&&nc.d>=40) S.locErr = "ตำแหน่งนี้ไม่อยู่ในเมืองที่มีในรายการ เลือกการ์ด “รอบ…” เพื่อค้นหาร้านรอบจุดนี้ได้เลย";
  if(S.area===NEAR) S.cuisines=[];
}

/* ---------- results ---------- */
function whenFor(x){
  if(S.meal==="any") return null;
  if(S.meal==="now") return (x.real&&x.off!=null) ? offsetNow(x.off) : placeNow();
  return {day:S.day,min:toMin(MEALS.find(m=>m.k===S.meal).t)};
}
function stepResults(){
  const co=S.country?COUNTRIES[S.country]:null, ar=curArea(), cur=co?co.cur:"$";
  const cuiTxt=cuisineText();
  const where=`${ar.th}${S.city?", "+placeName():""}`;
  const headHTML=(n)=>hero("ร้านแนะนำ",n===null?"กำลังหาร้านให้…":`<em>${n}</em> ร้าน${S.meal!=="any"?"ที่เปิด":""}น่าไป`,
      `${esc(cuiTxt)} · ${esc(where)}${S.loc&&!ar.near?` · ห่างจาก ${esc(S.loc.label)} ${distTxt(areaDist(S.area))}`:""}`,"fa-trophy");
  const foot=`<div class="actions"><button class="btn ghost" data-go="4">← เปลี่ยนเวลา</button><button class="btn" data-reset="1">เริ่มค้นหาใหม่</button></div>`;
  let items, meta="", mapsUrl;
  if(!REAL()) return headHTML(null)+`<div class="empty"><p><b>ยังไม่ได้ใส่ Google API key</b></p><p class="hint">กดปุ่มตั้งค่า (รูปเฟือง) ด้านบน แล้ววาง key เพื่อเริ่มค้นหาร้านจริง</p></div>`+foot;
  {
    const d=ensureReal();
    if(!d) return headHTML(null)+`<div class="loading"><span class="spin" aria-hidden="true"></span>กำลังค้นหาร้านจริงจาก Google Maps…</div>${'<div class="card sk"></div>'.repeat(3)}`+foot;
    if(d.err) return headHTML(null)+`<div class="empty"><p class="err">${esc(d.err)}</p><p class="hint">กดปุ่ม “ตั้งค่า” ด้านบนเพื่อตรวจ API key</p></div>`+foot;
    const ref=S.loc?locPt():[d.center.lat,d.center.lng];
    items=d.list.map(x=>({...x,dist:km(ref,[x.lat,x.lng])}));
    meta=`พบ ${d.list.length} ร้านในรัศมี ${d.rm/1000} กม. · ใช้ ${d.calls} คำขอค้นหา`;
    const kw="best "+(S.cuisines.includes("_all")?"restaurants":S.cuisines.map(k=>CUISINE_Q[k]).join(" "));
    mapsUrl=`https://www.google.com/maps/search/${encodeURIComponent(kw)}/@${d.center.lat},${d.center.lng},15z`;
  }
  const W=items.reduce((s,x)=>s+x.v,0), C=W?items.reduce((s,x)=>s+x.r*x.v,0)/W:4.3, M=200;
  items.forEach(x=>{ const w=whenFor(x); x.st=w?openReal(x,w.day,w.min):null; x.sm=x.v?(x.v/(x.v+M))*x.r+(M/(x.v+M))*C:0; });
  if(S.minR) items=items.filter(x=>x.r>=S.minR);
  if(S.resOnly) items=items.filter(x=>x.resv===true);
  if(S.openOnly) items=items.filter(x=>x.st&&x.st.open===true);
  const sorters={near:(a,b)=>(a.dist??0)-(b.dist??0)||b.sm-a.sm, smart:(a,b)=>b.sm-a.sm, rating:(a,b)=>b.r-a.r||b.v-a.v, reviews:(a,b)=>b.v-a.v, price:(a,b)=>(a.p||9)-(b.p||9)||b.sm-a.sm};
  items.sort(sorters[S.sort]||sorters.smart);
  const rankOpen=x=>!x.st?1:x.st.open===true?2:x.st.open===null?1:0;
  if(S.meal!=="any") items.sort((a,b)=>rankOpen(b)-rankOpen(a));
  const nOpen=S.meal!=="any"?items.filter(x=>x.st&&x.st.open===true).length:items.length;
  const shown=items.slice(0,S.show), more=items.length-shown.length;
  const hasDist=items.some(x=>x.dist!=null);
  const tb=(key,val,lbl)=>`<button class="tg ${S[key]===val?"sel":""}" data-set="${key}" data-val="${val}">${lbl}</button>`;
  return headHTML(nOpen) +
    `<div class="toolbar">
      <div class="grp"><span>เรียงตาม</span>${tb("sort","smart","แนะนำ")}${tb("sort","rating","คะแนน")}${tb("sort","reviews","รีวิวเยอะ")}${hasDist?tb("sort","near","ใกล้สุด"):""}${tb("sort","price","ราคาถูก")}</div>
      <div class="grp"><span>คะแนนขั้นต่ำ</span>${tb("minR",0,"ทั้งหมด")}${tb("minR",4.3,"4.3+")}${tb("minR",4.5,"4.5+")}</div>
      <div class="grp">${S.meal!=="any"?`<button class="tg ${S.openOnly?"sel":""}" data-flip="openOnly">เฉพาะที่เปิด</button>`:""}<button class="tg ${S.resOnly?"sel":""}" data-flip="resOnly">รับจอง</button></div>
    </div>
    <p class="hint">${meta?esc(meta)+" · ":""}“แนะนำ” ถ่วงคะแนนด้วยจำนวนรีวิว ร้านที่ได้ ★4.8 จาก 40 รีวิวจะไม่แซงร้าน ★4.6 จาก 3,000 รีวิวง่าย ๆ</p>
    <div class="list">${shown.length?shown.map((x,i)=>cardReal(x,i)).join(""):`<div class="empty">ไม่มีร้านตรงเงื่อนไข ลองลดคะแนนขั้นต่ำ ขยายรัศมี หรือเปลี่ยนเวลา</div>`}</div>
    ${more>0?`<button class="btn more" data-more="1">ดูเพิ่มอีก ${Math.min(10,more)} ร้าน <span>(เหลือ ${more})</span></button>`:""}
    <a class="maps" href="${mapsUrl}" target="_blank" rel="noopener"><i class="fa-solid fa-map-location-dot"></i> เปิดผลค้นหาเดียวกันบน <b>Google Maps ↗</b></a>
    <p class="note">ข้อมูลร้าน คะแนน และเวลาเปิดปิดจาก Google Maps ควรโทรเช็กก่อนไปอีกครั้งในวันหยุดนักขัตฤกษ์</p>
    ${foot}`;
}
function pillFor(x){
  if(!x.st) return "";
  if(x.st.open===null) return `<span class="pill p-mute">ไม่มีข้อมูลเวลา</span>`;
  if(x.st.open) return (x.st.left!=null&&x.st.left<=60)?`<span class="pill p-warn">ใกล้ปิด · อีก ${x.st.left} นาที</span>`:`<span class="pill p-ok">เปิดอยู่</span>`;
  return `<span class="pill p-bad">ปิดเวลานี้</span>`;
}
function scoreHTML(x){
  const stars="★".repeat(Math.round(x.r))+"☆".repeat(5-Math.round(x.r));
  return `<div class="score"><span class="num">${x.r?x.r.toFixed(1):"–"}</span><span class="stars" aria-hidden="true">${x.r?stars:""}</span><span class="rv">${x.v.toLocaleString("en-US")} รีวิว</span></div>`;
}
function favBtn(id){ return `<button class="fav ${favs.has(id)?"on":""}" data-fav="${esc(id)}" aria-label="บันทึกร้าน">${favs.has(id)?"♥":"♡"}</button>`; }


function cardReal(x,i){
  const w=whenFor(x)||placeNow();
  const dayIdx=(w.day+6)%7; // weekdayDescriptions เริ่มวันจันทร์
  const today=x.wd?x.wd[dayIdx]:"";
  const todayTxt=today?today.replace(/^[^:]+:\s*/,""):"ไม่มีข้อมูลเวลา";
  const cur=S.country?COUNTRIES[S.country].cur:"$";
  const resv=x.resv===true?`<span class="pill p-warn">รับจอง</span> <span class="v-note">โทรหรือจองผ่านเว็บร้าน</span>`
    :x.resv===false?`<span class="pill p-ok">ไม่รับจอง · Walk-in</span>`:`<span class="pill p-mute">ไม่มีข้อมูล</span>`;
  const dist=x.dist!=null?`<span class="dist in">${distTxt(x.dist)}</span>`:"";
  const nav=`https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lng}&destination_place_id=${encodeURIComponent(x.id)}`;
  return `<article class="card ${x.st&&x.st.open===false?"closed":""}">
    <div class="c-head ${x.photo?"wp":""}">${x.photo?`<img class="thumb" src="${esc(x.photo)}" alt="" loading="lazy">`:`<span class="rank ${i<3?"rk1":""}">#${i+1}</span>`}
      <div>${x.photo?`<span class="rank inl ${i<3?"rk1":""}">#${i+1}</span>`:""}<h3 class="c-name">${esc(x.n)}</h3>
        <div class="c-meta"><span>${esc(x.type||cuisineText())}</span>${x.p?`<span>${cur.repeat(x.p)}<span class="dim">${cur.repeat(4-x.p)}</span></span>`:""}${pillFor(x)}${dist}</div></div>
      ${scoreHTML(x)}</div>
    <div class="facts">
      <div class="fact"><span class="k">เวลาเปิด–ปิด ${S.meal!=="any"&&S.meal!=="now"?DAYS_FULL[w.day]:"วันนี้"}</span><span class="v">${esc(todayTxt)}</span>
        ${x.wd?`<details><summary>ดูทั้งสัปดาห์</summary><ul class="wk">${x.wd.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></details>`:""}</div>
      <div class="fact"><span class="k">โทร</span><span class="v tel">${x.t?`<span class="mono">${esc(x.t)}</span><button class="copy" data-copy="${esc(x.t)}">คัดลอก</button>`:`<span class="v-note">ไม่มีเบอร์ใน Google</span>`}</span></div>
      <div class="fact"><span class="k">การจอง</span><span class="v">${resv}</span></div>
      <div class="fact"><span class="k">ที่อยู่</span><span class="v small">${esc(x.addr)}</span></div>
    </div>
    <div class="c-foot"><div class="links"><a href="${esc(x.maps)}" target="_blank" rel="noopener"><i class="fa-solid fa-map"></i> Google Maps</a><a class="go" href="${nav}" target="_blank" rel="noopener"><i class="fa-solid fa-diamond-turn-right"></i> นำทาง</a>${x.web?`<a href="${esc(x.web)}" target="_blank" rel="noopener"><i class="fa-solid fa-globe"></i> เว็บไซต์</a>`:""}</div>${favBtn(x.id)}</div>
    ${x.photoBy?`<p class="credit">รูป: ${esc(x.photoBy)} · Google Maps</p>`:""}
  </article>`;
}

/* ---------- render + events ---------- */
function render(){
  renderChrome();
  const fns=[stepCountry,stepCity,stepArea,stepCuisine,stepTime,stepResults];
  $("#stage").innerHTML=(S.settings?settingsPanel():"")+fns[S.step]();
  $("#setBtn").classList.toggle("sel",S.settings);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(b.id==="setBtn"){ S.settings=!S.settings; render(); window.scrollTo({top:0}); return; }
  if(d.savekey){ const v=$("#apikey").value.trim(); try{ v?localStorage.setItem("kd-key",v):localStorage.removeItem("kd-key"); }catch(err){} location.reload(); return; }
  if(d.delkey){ try{ localStorage.removeItem("kd-key"); }catch(err){} location.reload(); return; }
  if(d.go!==undefined){ go(+d.go); return; }
  if(d.gps){ useGPS(); return; }
  if(d.country){ if(S.country!==d.country){S.city=S.area=null;S.cuisines=[];S.day=null;} S.country=d.country; const cs=Object.keys(COUNTRIES[d.country].cities); if(cs.length===1){S.city=cs[0];go(2);} else go(1); return; }
  if(d.city){ if(S.city!==d.city){S.area=null;S.cuisines=[];} S.city=d.city; go(2); return; }
  if(d.area){ if(S.area!==d.area) S.cuisines=[]; S.area=d.area; go(3); return; }
  if(d.asort){ S.areaSort=d.asort; render(); return; }
  if(d.lm!==undefined){ const l=LANDMARKS[S.city][+d.lm]; setLoc(l[1],l[2],l[0],{lm:+d.lm}); render(); return; }
  if(d.my){ const m=myAreas.find(m=>String(m.id)===d.my); if(m){ setLoc(m.lat,m.lng,m.name,{myId:m.id}); S.area=NEAR; S.cuisines=[]; go(3);} return; }
  if(d.locgo){ const r=parseLoc($("#locq").value); if(r.err) S.locErr=r.err; else setLoc(r.lat,r.lng,"จุดที่ปักหมุด"); render(); return; }
  if(d.locclear){ S.loc=null; S.locErr=""; S.locMove=null; S.areaSort=null; if(S.area===NEAR){S.area=null;S.cuisines=[];} render(); return; }
  if(d.radius){ S.radius=+d.radius; render(); return; }
  if(d.move){ const {co,ci}=S.locMove; Object.assign(S,{country:co,city:ci,area:null,cuisines:[],day:null,locMove:null}); S.loc={...S.loc,lm:undefined}; render(); return; }
  if(d.savemy){ const name=($("#myname").value.trim()||"ย่านของฉัน").slice(0,40), id=Date.now();
    myAreas.push({id,city:S.city,name,lat:S.loc.lat,lng:S.loc.lng}); saveAreas(); S.loc={...S.loc,label:name,myId:id,lm:undefined}; render(); return; }
  if(d.delmy){ myAreas=myAreas.filter(m=>String(m.id)!==d.delmy); saveAreas(); S.loc={...S.loc,myId:undefined}; render(); return; }
  if(d.cuisine){
    const i=S.cuisines.indexOf(d.cuisine);
    if(i>=0) S.cuisines.splice(i,1);
    else { S.cuisines=S.cuisines.filter(k=>k!=="_all"); if(S.cuisines.length<3) S.cuisines.push(d.cuisine); }
    render(); return;
  }
  if(d.allc){
    S.cuisines=S.cuisines.includes("_all")?[]:["_all"];
    render(); return;
  }
  if(d.meal){ S.meal=d.meal; render(); return; }
  if(d.day!==undefined){ S.day=+d.day; render(); return; }
  if(d.next){ S.show=10; go(+d.next); return; }
  if(d.set){ S[d.set]=d.set==="sort"?d.val:+d.val; S.show=10; render(); return; }
  if(d.flip){ S[d.flip]=!S[d.flip]; S.show=10; render(); return; }
  if(d.more){ S.show+=10; render(); return; }
  if(d.fav){ favs.has(d.fav)?favs.delete(d.fav):favs.add(d.fav); saveFavs(); render(); return; }
  if(d.reset){ Object.assign(S,{step:0,country:null,city:null,area:null,cuisines:[],day:null,meal:null,minR:0,resOnly:false,openOnly:false,sort:"smart",areaSort:null,locMove:null,show:10}); render(); return; }
  if(d.copy){
    const done=()=>{ b.textContent="คัดลอกแล้ว"; setTimeout(()=>b.textContent="คัดลอก",1500); };
    try{ navigator.clipboard.writeText(d.copy).then(done,()=>selectText(b)); }catch(err){ selectText(b); }
  }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const map={locq:"[data-locgo]",myname:"[data-savemy]",apikey:"[data-savekey]"};
  if(map[e.target.id]){ e.preventDefault(); const t=document.querySelector(map[e.target.id]); if(t) t.click(); }
});
document.addEventListener("input",e=>{
  if(e.target.id!=="areaq") return;
  const q=e.target.value.trim().toLowerCase(); let shown=0;
  document.querySelectorAll("#areagrid .opt").forEach(o=>{ const hit=!q||o.dataset.text.includes(q); o.hidden=!hit; if(hit) shown++; });
  $("#areaempty").hidden=shown>0;
});
function selectText(b){ const el=b.previousElementSibling; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

if(!REAL()) S.settings=true;
render();
</script>
</body>
</html>
